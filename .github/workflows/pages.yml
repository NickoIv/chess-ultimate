name: Publish Chess Ultimate Academy

on:
  push:
    branches: [main]
    paths:
      - index.html
      - manifest.webmanifest
      - sw.js
      - icon.svg
      - icon-master.jpg
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: chess-ultimate-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up icon renderer
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install --quiet "Pillow>=10,<12"
      - name: Prepare public game and app icons
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js icon.svg _site/
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          im = Image.open('icon-master.jpg').convert('RGB')
          out = Path('_site')
          for size, name in ((180,'apple-touch-icon.png'),(192,'icon-192.png'),(512,'icon-512.png'),(32,'favicon-32.png')):
              im.resize((size,size),Image.Resampling.LANCZOS).save(out/name,optimize=True)
          bg = Image.new('RGB',(512,512),(3,33,37))
          bg.paste(im.resize((410,410),Image.Resampling.LANCZOS),(51,51))
          bg.save(out/'icon-maskable-512.png',optimize=True)
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
